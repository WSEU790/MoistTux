# Builds, tests and publishes NEXUS on every push to the release branches.
# Each run becomes a GitHub Release v<VERSION>.<run number>; installed copies
# of NEXUS pick it up automatically (signed with NEXUS_UPDATE_SIGNING_KEY).
name: build-test-release

on:
  push:
    branches: [main, nexus-foundation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

# Linux jobs are pinned to ubuntu-24.04: on the ubuntu-26.04 image (the
# ubuntu-latest label from October 2026) the Ubuntu archive hosts did not
# resolve, so apt-get could not install NSIS. NEXUS itself is tested against
# Ubuntu 26.04 servers separately (docs/STATUS.md).
jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Build UI
        run: make ui
      - name: Vet and test
        run: |
          go vet ./...
          go test -count=1 ./...
          npm --prefix web run typecheck

  build:
    runs-on: ubuntu-24.04
    needs: test-linux
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - id: v
        name: Version
        run: echo "version=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build UI, agents, NEXUS.exe and installer
        run: |
          make ui
          make installer VERSION=${{ steps.v.outputs.version }}
          cp dist/linux-amd64/nexus-agent dist/nexus-agent-linux-amd64
          cp dist/linux-arm64/nexus-agent dist/nexus-agent-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ steps.v.outputs.version }}
          path: |
            dist/NEXUS-Setup-*.exe
            dist/windows-amd64/NEXUS.exe
            dist/windows-amd64/nexus-core.exe
            dist/nexus-agent-linux-amd64
            dist/nexus-agent-linux-arm64
          if-no-files-found: error

  test-windows:
    runs-on: windows-latest
    needs: build
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Unit tests on Windows (DPAPI, policy, updater, saved logins)
        run: go test -count=1 ./internal/pki/... ./internal/core/ai/... ./internal/core/monitor/... ./internal/core/deploy/... ./internal/core/update/... ./internal/core/secrets/...
      - uses: actions/download-artifact@v4
        with: { name: "nexus-${{ needs.build.outputs.version }}", path: artifacts }
      - name: Core smoke test on Windows
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\nexus-data"; $tok = "$env:RUNNER_TEMP\token.txt"
          $p = Start-Process -FilePath artifacts\windows-amd64\nexus-core.exe -ArgumentList "--data","$data","--listen","127.0.0.1:7790","--token-file","$tok" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $tok); $i++) { Start-Sleep -Milliseconds 500 }
          $h = @{ Authorization = "Bearer $(Get-Content $tok)" }
          $b = Invoke-RestMethod -Uri http://127.0.0.1:7790/api/bootstrap -Headers $h
          if ($b.core_fingerprint.Length -ne 64) { throw "core identity missing" }
          if ($b.version -ne $env:VERSION) { throw "version $($b.version) != $env:VERSION" }
          $sealed = Get-Content "$data\core.key.sealed" -Raw
          if (-not $sealed.StartsWith("enc:dpapi:")) { throw "core key is not sealed with DPAPI" }
          $u = Invoke-RestMethod -Uri http://127.0.0.1:7790/api/update -Headers $h
          Write-Host "updater: current=$($u.current) enabled=$($u.enabled) can_install=$($u.can_install)"
          if (-not $u.enabled -or -not $u.can_install) { throw "release build must be able to update itself" }
          Stop-Process -Id $p.Id
      - name: Installer test (install, update over a running app, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts\NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $dir = "$env:LOCALAPPDATA\Programs\NEXUS"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\NEXUS"
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          if (-not (Test-Path "$dir\NEXUS.exe")) { throw "NEXUS.exe was not installed" }
          if ((Get-ItemProperty $key).DisplayVersion -ne $env:VERSION) { throw "Apps & features entry has the wrong version" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\NEXUS.lnk")) { throw "Start menu shortcut missing" }
          # Simulate the self-updater: replace a running NEXUS and relaunch it.
          $app = Start-Process -FilePath "$dir\NEXUS.exe" -ArgumentList "--headless","--data","$env:RUNNER_TEMP\nexus-app" -PassThru
          Start-Sleep -Seconds 5
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Start-Process -FilePath $setup -ArgumentList "/S","/UPDATE","/RELAUNCH" -Wait
          Write-Host "update install took $($sw.Elapsed.TotalSeconds)s"
          if (-not $app.HasExited) { throw "running NEXUS was not closed by the installer" }
          Start-Sleep -Seconds 3
          if (-not (Get-Process NEXUS -ErrorAction SilentlyContinue)) { throw "NEXUS was not relaunched after the update" }
          Stop-Process -Name NEXUS -Force
          Start-Sleep -Seconds 2
          Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList "/S","_?=$dir" -Wait
          if (Test-Path "$dir\NEXUS.exe") { throw "uninstall left NEXUS.exe behind" }
          if (Test-Path $key) { throw "uninstall left the Apps & features entry" }

  release:
    runs-on: ubuntu-24.04
    needs: [build, test-windows]
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NEXUS_UPDATE_SIGNING_KEY: ${{ secrets.NEXUS_UPDATE_SIGNING_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Require the signing key
        run: |
          if [ -z "$NEXUS_UPDATE_SIGNING_KEY" ]; then
            echo "::error::Add the NEXUS_UPDATE_SIGNING_KEY repository secret (Settings → Secrets and variables → Actions). Without it installed apps cannot verify updates."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with: { name: "nexus-${{ env.VERSION }}", path: dist }
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Built from \`${GITHUB_SHA::7}\` on ${GITHUB_REF_NAME}."
            echo
            if [ -n "$prev" ]; then git log --no-merges --format='- %s' "$prev"..HEAD; else git log --no-merges --format='- %s' -n 20; fi
          } > dist/notes.md
          cat dist/notes.md
      - name: Sign update manifest
        run: make release-manifest VERSION=$VERSION
      - name: Publish GitHub Release
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "NEXUS $VERSION" --notes-file dist/notes.md \
            "dist/NEXUS-Setup-$VERSION.exe" dist/nexus-update.json dist/nexus-update.json.sig \
            dist/nexus-agent-linux-amd64 dist/nexus-agent-linux-arm64
